# Default values for AegisX Helm Chart

global:
  environment: production
  domain: aegisx.local

backend:
  replicaCount: 2
  image:
    repository: aegisx-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  env:
    LOG_LEVEL: INFO
    RATE_LIMIT_ENABLED: "true"

worker:
  replicaCount: 2
  image:
    repository: aegisx-backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 2
  image:
    repository: aegisx-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgresql:
  enabled: true
  auth:
    username: aegisx
    password: aegisx_prod_password
    database: aegisx

redis:
  enabled: true
  auth:
    password: aegisx_redis_password

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: soc.aegisx.local
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls: []
